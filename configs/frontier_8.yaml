# Frontier pool: the 8 strongest models on the router, each at its best.
#
# Coherent tier: every candidate sits in the ~40-56 band of the Artificial
# Analysis intelligence index (source: orquesta-web autorouter-intelligence).
# These are reasoning-native models, so they run at their default (best) effort
# rather than forced thinking-OFF; the ELO compares them at full strength, not
# under a uniform effort cap. For a fair uniform-effort test use orq_arena.yaml.
#
# Run: orq-arena run --config configs/frontier_8.yaml --prompts your_prompts.jsonl
# Cost note: 8 models = C(8,2)=28 matches. Frontier models are pricey; the
# preflight prints a spend projection before anything runs.

# Output caps: models that always think spend output tokens on reasoning before
# they answer. Measured 2026-10-05 over the starter prompts with room to think:
# deepseek-flash and kimi-k3 used up to about 4,200 reasoning tokens per answer,
# kimi-k2.6 up to about 5,800, deepseek-v4-pro up to about 1,400. At the default
# 2048 cap they ran out mid-thought and returned empty answers, so each carries
# its own `max_tokens`. A cap is a ceiling, not a target.
candidates:
  - model_id: anthropic/claude-opus-4-8          # AA 55.7
  - model_id: anthropic/claude-opus-4-7          # AA 53.5
  - model_id: openai/gpt-5.4                      # AA 51.4
  - model_id: google/gemini-3.5-flash            # AA 50.2
  - model_id: google/gemini-3.1-pro-preview      # AA 46.5
  - model_id: baseten/deepseek-v4-pro-0813       # AA 44.3 as deepseek-v4-pro; that id is deprecated, this is the same model via baseten
    max_tokens: 4096
  - model_id: moonshotai/kimi-k2.6               # AA 42.8
    max_tokens: 8000
  - model_id: deepseek/deepseek-flash            # AA 40.3 as deepseek-v4-flash; that id is deprecated, this is its current id
    max_tokens: 8000

# Decision-model panel, see docs/research/llm-judges-vs-decision-models.md.
# Frontier candidates are judged, not judging, so there is no self-judge overlap
# here. A decision panel costs a fraction of a prompted one; frontier chat judges
# (opus/gpt-5.4/gemini-pro, with judge_api: llm) cost about 10x the old cheap trio.
judge_api: decisions
judges:
  - typesafe/jev-latest
  - perplexity/pplx-decider-v1-27b
  - openai/gpt-6-luna

replacement_judges:
  - orq/decider-4b

criteria: >-
  Accuracy and correctness, helpfulness and completeness, clarity, and
  relevance to the prompt.

min_successful_judges: 2
