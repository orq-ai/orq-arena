# orq-arena default configuration.
# All candidate + judge calls route through the orq.ai router gateway.

# Match rules. max_rounds is the number of prompts each match draws; a tied or
# inconclusive round uses its prompt and is not replaced. starting_hp and the
# damage_* tiers drive the live TUI health bars only (the rating never sees
# them, it's fed per-round verdicts).
match:
  max_rounds: 5
  starting_hp: 100
  damage_unanimous: 30    # all decisive votes agree (minimum 2)
  damage_majority: 15     # split decision

# Orq.ai gateway
gateway:
  base_url: https://my.orq.ai/v3/router
  # Per-response output cap. Creative prompts overflow 1024 easily; a cut
  # response shows as ✂ truncated and judges punish it. Per-candidate
  # max_tokens overrides this.
  candidate_max_tokens: 2048
  # Cap, not target, costs nothing on frugal judges, and thinking-by-default
  # judges (e.g. gemini-2.5-flash) burn ~500 reasoning tokens before the
  # verdict; 512 starves them into failed votes. Decision judges ignore it.
  judge_max_tokens: 2048
  # Max silence between stream chunks (seconds). Generous: thinking models may
  # pause for minutes before the first token. Never a total-duration cap.
  stream_read_timeout_s: 1200
  judge_timeout_ms: 90000

# The model pool, any size >= 2. Default pool is uniform thinking-OFF for a
# fair apples-to-apples ELO; see configs/reasoning_arena.yaml for the
# uniform thinking-ON counterpart.
#
# reasoning: raw router fields, forwarded verbatim. Recipes:
#   OpenAI  -> reasoning: { reasoning_effort: low|medium|high }
#   Claude  -> reasoning: { thinking: { type: enabled, budget_tokens: 4096 } }
#   Gemini3 -> reasoning: { thinking: { type: enabled, thinking_level: low|high } }
candidates:
  - model_id: anthropic/claude-opus-4-8
  - model_id: anthropic/claude-sonnet-4-6
  - model_id: openai/gpt-5.4
  - model_id: openai/gpt-5.4-mini
  - model_id: google/gemini-3.1-pro-preview
    # think-by-default model: explicitly disabled for the uniform-OFF pool
    # (router coerces disable to its minimum on thinking-enforced models)
    reasoning: { thinking: { type: disabled } }
  - model_id: google/gemini-3.5-flash
    reasoning: { thinking: { type: disabled } }
  # DeepSeek V4 Pro as served by nebius. `deepseek/deepseek-chat`, which held
  # this slot, stopped being served (404 since at least 2026-10-05). Of the 16
  # DeepSeek offerings the router answered for on that day, four ran without
  # thinking, and this was the fastest of them by a wide margin: a 6 s median
  # per answer, against 25 to 31 s for the other three. DeepSeek's own
  # `deepseek/deepseek-flash` always thinks and ignores `thinking: disabled`, so
  # it does not fit a uniform thinking-OFF pool.
  - model_id: nebius/deepseek-ai/DeepSeek-V4-Pro
    # named, because the id's own short form is the vendor path
    # `deepseek-ai/DeepSeek-V4-Pro`, which is no use on a leaderboard
    name: deepseek-v4-pro
    reasoning: { thinking: { type: disabled } }
  - model_id: mistral/mistral-medium-2604
# Excluded from the default pool (thinking can't be disabled via the router,
# verified 2026-07-11): moonshotai/kimi-k2.6, alibaba/qwen3.5-flash, and the
# DeepSeek-served ids deepseek/deepseek-v4-pro and deepseek/deepseek-flash
# (verified 2026-10-05; the nebius V4 Pro offering above is the exception).
# They belong in configs/reasoning_arena.yaml.

# Judge panel: decision models, each asked one A/B/tie question through the orq.ai
# Decisions API, both seat orders (a judge that flips abstains and is recorded).
# They bill input tokens only and return a probability per option. Picked by
# agreement with a strong reference jury over two 140-round pools, see
# docs/research/llm-judges-vs-decision-models.md. gpt-6-luna shares OpenAI's
# family with the gpt candidates and the preflight says so. For a prompted panel that writes its reasons, set judge_api: llm and
# list chat models, e.g. anthropic/claude-haiku-4-5-20251001,
# google/gemini-3.5-flash-lite, openai/gpt-5.4-nano.
judge_api: decisions
judges:
  - typesafe/jev-latest
  - perplexity/pplx-decider-v1-27b
  - openai/gpt-6-luna

replacement_judges:
  - orq/decider-4b

# What the jury judges on (feeds evaluatorq's pairwise criteria).
criteria: >-
  Accuracy and correctness, helpfulness and completeness, clarity, and
  relevance to the prompt.

# Fewer decisive reconciled votes than this -> round is inconclusive
# (no damage, never rated; its prompt is spent). Guards against jury-of-one verdicts.
min_successful_judges: 2
