# configs/budget_8.yaml judged live by the first decision panel the research
# note tried (jev-latest, decider-4b, gpt-6-luna). The run behind its
# "live decisions run" figures:
#   orq-arena run --config docs/research/configs/budget_8_live_decisions.yaml \
#     --prompts prompts/starter.jsonl -y

candidates:
  - model_id: openai/gpt-5.4-mini                       # AA 16.6 (non-reasoning)
  - model_id: google/gemini-3.7-flash                   # replaced gemini-2.5-flash (deprecated 2026-10-20); thinks by default
    max_tokens: 4096                                    # about 1,000 reasoning tokens per answer, and it ran to 1,963 of 2048
  - model_id: deepseek/deepseek-flash                   # replaced deepseek-chat (no longer served); V4 Flash, always thinks
    max_tokens: 8000                                    # up to about 4,200 reasoning tokens per answer; empty answers at 2048
  - model_id: mistral/mistral-small-2603                # AA ~12-20
  - model_id: xai/grok-4-1-fast                         # AA 16.9 (non-reasoning)
  - model_id: cohere/command-a-03-2025                  # AA ~8-29 (Command A)
  - model_id: alibaba/qwen3.5-flash                     # small alibaba; thinks by design
  - model_id: anthropic/claude-haiku-4-5-20251001       # also the anthropic judge below;
    # self-judge exclusion drops it from the panel for its own matches only.

judge_api: decisions
judges:
  - typesafe/jev-latest
  - orq/decider-4b
  - openai/gpt-6-luna

replacement_judges:
  - perplexity/pplx-decider-v1-27b

criteria: >-
  Accuracy and correctness, helpfulness and completeness, clarity, and
  relevance to the prompt.

min_successful_judges: 2
