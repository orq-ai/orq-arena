# The quickstart pool with a decision-model panel, for re-judging the committed
# quickstart log in docs/research/llm-judges-vs-decision-models.md:
#   orq-arena rejudge examples/quickstart/battles.jsonl \
#     --config docs/research/configs/quickstart_decisions.yaml --judge-api decisions \
#     --judge typesafe/jev-latest --judge perplexity/pplx-decider-v1-27b --judge openai/gpt-6-luna \
#     --concurrency 3 --output qs.decisions.jsonl
# The --judge flags replace the panel below, which is the first one the note tried.

match:
  max_rounds: 5
  starting_hp: 100
  damage_unanimous: 30
  damage_majority: 15

gateway:
  base_url: https://api.orq.ai/v3/router

preflight:
  thinking_probe: true

candidates:
  - model_id: anthropic/claude-opus-4-8
  - model_id: anthropic/claude-sonnet-4-6
  - model_id: openai/gpt-5.4
  - model_id: openai/gpt-5.4-mini
  - model_id: google/gemini-3.1-pro-preview
    reasoning: { thinking: { type: disabled } }
  - model_id: google/gemini-3.5-flash
    reasoning: { thinking: { type: disabled } }
  - model_id: deepseek/deepseek-chat
  - model_id: mistral/mistral-medium-2604

judge_api: decisions
judges:
  - typesafe/jev-latest
  - orq/decider-4b
  - openai/gpt-6-luna
